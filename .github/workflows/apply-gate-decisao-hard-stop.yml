name: Production readiness validation

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/apply-gate-decisao-hard-stop.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: UI interaction-pattern audit
        run: npm run test:padroes-ui
      - name: Numeric ranges
        run: npm run test:faixas
      - name: Calculators
        run: npm run test:calculadoras
      - name: Sedation
        run: npm run test:sedacao
      - name: Electrolytes
        run: npm run test:eletrolitos
      - name: Vasoactives
        run: npm run test:vasoativos
      - name: Ventilation
        run: npm run test:vm
      # Reexecutado após corrigir a leitura da string literal longa de hiperventilação do TCE.
