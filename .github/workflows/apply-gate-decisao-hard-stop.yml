name: Production readiness validation

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/apply-gate-decisao-hard-stop.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Full production validation
        run: node ./scripts/test-all-production.cjs
      - name: Production dependency critical audit
        run: npm audit --omit=dev --audit-level=critical
      # Read-only final gate. The absolute i18n test remains strict; production
      # accepts only the separately measured legacy debt ceiling, which can only decrease.
