name: Apply uncertainty guidance repair

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/corrige-duvida-padroes.cjs
      - .github/workflows/apply-gate-decisao-hard-stop.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply explicit uncertainty guidance
        run: node scripts/corrige-duvida-padroes.cjs
      - name: Validate UI pattern audit
        run: npm run test:padroes-ui
      - name: Validate shock module
        run: npm run test:choque
      - name: Validate ACLS
        run: npm run test:acls
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Scope and whitespace gate
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' acls-bradycardia-tree.ts shock-decision-tree.ts | sort)"
          test "$changed" = "$expected"
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acls-bradycardia-tree.ts shock-decision-tree.ts
          git commit -m 'fix(ui): add explicit uncertainty guidance at high-risk decisions'
          git push origin HEAD:fix-avc-slider-first
