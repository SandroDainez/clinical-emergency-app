name: Apply final UI convergence repair

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/corrige-ui-pendencias.cjs
      - .github/workflows/apply-gate-decisao-hard-stop.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply UI repair
        run: node scripts/corrige-ui-pendencias.cjs
      - name: Verify the two targeted regressions are gone
        run: |
          ! grep -F 'Number(((faixa.min + faixa.max) / 2)' components/protocol-screen/electrolyte-calculator-screen.tsx
          ! grep -F 'keyboardType="numeric"' components/protocol-screen/acls-decision-flow-screen.tsx
          ! grep -F 'keyboardType={field.customKeyboard === "numeric" ? "numeric" : "default"}' components/protocol-screen/acls-decision-flow-screen.tsx
      - name: Validate electrolytes
        run: npm run test:eletrolitos
      - name: Validate input ranges
        run: npm run test:faixas
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Scope and whitespace gate
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' components/protocol-screen/acls-decision-flow-screen.tsx components/protocol-screen/electrolyte-calculator-screen.tsx | sort)"
          test "$changed" = "$expected"
      - name: Report broader UI audit debt without masking this repair
        continue-on-error: true
        run: npm run test:padroes-ui
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/protocol-screen/acls-decision-flow-screen.tsx components/protocol-screen/electrolyte-calculator-screen.tsx
          git commit -m 'fix(ui): close numeric input convergence gaps'
          git push origin HEAD:fix-avc-slider-first
