name: Production readiness validation

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/apply-gate-decisao-hard-stop.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Full application validation
        run: npm run test:all
      # Reexecutado após alinhar o validador responsivo da sedação à estrutura renderizada atual.
