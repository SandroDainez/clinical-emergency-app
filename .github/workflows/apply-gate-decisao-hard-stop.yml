name: Production readiness validation

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/apply-gate-decisao-hard-stop.yml
      - scripts/test-all-production.cjs
      - scripts/valida-i18n-debt.cjs
      - scripts/valida-traducao-runtime-debt.cjs
      - scripts/valida-traducao-composta-debt.cjs
      - scripts/valida-paleta-debt.cjs
      - scripts/valida-prazo-visivel-debt.cjs
      - scripts/valida-leitura-fonte-debt.cjs
      - scripts/run-all-instruments-gate.cjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Full production validation
        run: node ./scripts/test-all-production.cjs
      - name: Production dependency critical audit
        run: npm audit --omit=dev --audit-level=critical
      # Final read-only gate on the corrected branch head. Absolute debt tests
      # remain available; production substitutes only baselines proven against
      # emergencias-2-ui-core and each ceiling is one-way (can only decrease).
      # This run includes build:web and Playwright E2E through test:all.
