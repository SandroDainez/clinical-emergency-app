name: Fix focused clinical UI hierarchy

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - .github/workflows/fix-clinical-ui-hierarchy.yml
      - scripts/corrige-hierarquia-sedo-ovace-vm-pbw.cjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic hierarchy fixes
        run: node scripts/corrige-hierarquia-sedo-ovace-vm-pbw.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Clinical step parity
        run: node scripts/valida-paridade-clinical-steps.cjs
      - name: Input and navigation safety
        run: node scripts/valida-seguranca-input-voltar-nihss.cjs
      - name: Web build
        run: npm run build:web
      - name: Validate diff and scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            clinical-calculators-engine.ts \
            components/protocol-screen/acls-choking-screen.tsx \
            components/protocol-screen/sedation-calculator-screen.tsx \
            components/protocol-screen/ventilation-flow-screen.tsx \
            components/protocol-screen/ventilator-configurator-card.tsx | sort)"
          test "$changed" = "$expected"
      - name: Commit focused hierarchy fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical-calculators-engine.ts \
            components/protocol-screen/acls-choking-screen.tsx \
            components/protocol-screen/sedation-calculator-screen.tsx \
            components/protocol-screen/ventilation-flow-screen.tsx \
            components/protocol-screen/ventilator-configurator-card.tsx
          git commit -m "refactor(ui): make emergency modules task-first"
          git push origin HEAD:emergencias-2-ui-core
