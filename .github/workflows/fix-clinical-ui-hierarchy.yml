name: Fix focused clinical UI hierarchy

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - .github/workflows/fix-clinical-ui-hierarchy.yml
      - scripts/corrige-hierarquia-sedo-ovace-vm-pbw.cjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adapt hierarchy patcher to tokenized OVACE screen
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'scripts/corrige-hierarquia-sedo-ovace-vm-pbw.cjs';
          let src = fs.readFileSync(file, 'utf8');
          const oldAnchor = `  const styleAnchor = '  scroll: { flex: 1, backgroundColor: "#101722" },\\n';`;
          const newAnchor = `  const styleAnchor = '  scroll: { flex: 1, backgroundColor: TEMAS.escuro.cores.bg },\\n';`;
          if (!src.includes(oldAnchor)) throw new Error('âncora antiga do patcher não encontrada');
          src = src.replace(oldAnchor, newAnchor);

          const oldStyles = '  src = src.replace(styleAnchor, `${styleAnchor}  guideCard: { backgroundColor: "#192331", borderRadius: 18, padding: 18, borderWidth: 2, borderColor: "#60a5fa", gap: 12 },\\n  guideEyebrow: { fontSize: 12, fontWeight: "900", letterSpacing: 1.2, color: "#93c5fd" },\\n  guideTitle: { fontSize: 24, lineHeight: 30, fontWeight: "900", color: "#f8fafc" },\\n  guideBody: { fontSize: 16, lineHeight: 23, fontWeight: "600", color: "#cbd5e1" },\\n  guideAction: { borderRadius: 14, borderWidth: 1, borderColor: "#22c55e", backgroundColor: "rgba(34,197,94,0.10)", padding: 14, gap: 6 },\\n  guideActionCritical: { borderColor: "#ef4444", backgroundColor: "rgba(239,68,68,0.10)" },\\n  guideActionTitle: { fontSize: 18, lineHeight: 24, fontWeight: "900", color: "#f8fafc" },\\n  guideActionText: { fontSize: 15, lineHeight: 22, fontWeight: "600", color: "#cbd5e1" },\\n`);';
          const newStyles = '  src = src.replace(styleAnchor, `${styleAnchor}  guideCard: { backgroundColor: TEMAS.escuro.cores.surface, borderRadius: RAIO.card, padding: 18, borderWidth: 2, borderColor: TEMAS.escuro.cores.primary, gap: 12 },\\n  guideEyebrow: { fontSize: TIPOGRAFIA.micro.fontSize, fontWeight: "900", letterSpacing: 1.2, color: TEMAS.escuro.cores.primary },\\n  guideTitle: { fontSize: TIPOGRAFIA.title.fontSize, lineHeight: 30, fontWeight: "900", color: TEMAS.escuro.cores.text },\\n  guideBody: { fontSize: TIPOGRAFIA.body.fontSize, lineHeight: 23, fontWeight: "600", color: TEMAS.escuro.cores.textSecondary },\\n  guideAction: { borderRadius: RAIO.input, borderWidth: 1, borderColor: TEMAS.escuro.cores.success, backgroundColor: TEMAS.escuro.cores.surface, padding: 14, gap: 6 },\\n  guideActionCritical: { borderColor: TEMAS.escuro.cores.critical },\\n  guideActionTitle: { fontSize: TIPOGRAFIA.step.fontSize, lineHeight: 24, fontWeight: "900", color: TEMAS.escuro.cores.text },\\n  guideActionText: { fontSize: TIPOGRAFIA.caption.fontSize, lineHeight: 22, fontWeight: "600", color: TEMAS.escuro.cores.textSecondary },\\n`);';
          if (!src.includes(oldStyles)) throw new Error('bloco antigo de estilos OVACE não encontrado no patcher');
          src = src.replace(oldStyles, newStyles);
          fs.writeFileSync(file, src);
          NODE
      - name: Apply deterministic hierarchy fixes
        run: |
          node scripts/corrige-hierarquia-sedo-ovace-vm-pbw.cjs
          git checkout -- scripts/corrige-hierarquia-sedo-ovace-vm-pbw.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Clinical step parity
        run: node scripts/valida-paridade-clinical-steps.cjs
      - name: Input and navigation safety
        run: node scripts/valida-seguranca-input-voltar-nihss.cjs
      - name: Web build
        run: npm run build:web
      - name: Validate diff and scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            clinical-calculators-engine.ts \
            components/protocol-screen/acls-choking-screen.tsx \
            components/protocol-screen/sedation-calculator-screen.tsx \
            components/protocol-screen/ventilation-flow-screen.tsx \
            components/protocol-screen/ventilator-configurator-card.tsx | sort)"
          test "$changed" = "$expected"
      - name: Commit focused hierarchy fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clinical-calculators-engine.ts \
            components/protocol-screen/acls-choking-screen.tsx \
            components/protocol-screen/sedation-calculator-screen.tsx \
            components/protocol-screen/ventilation-flow-screen.tsx \
            components/protocol-screen/ventilator-configurator-card.tsx
          git commit -m "refactor(ui): make emergency modules task-first"
          git push origin HEAD:emergencias-2-ui-core
