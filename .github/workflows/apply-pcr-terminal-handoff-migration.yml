name: Apply PCR terminal handoff migration

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - ".github/workflows/apply-pcr-terminal-handoff-migration.yml"

permissions:
  contents: write

jobs:
  apply-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate pre-migration state
        run: |
          node scripts/valida-migracao-pcr-handoffs-terminais.cjs
          node scripts/valida-contagem-transition-contracts.cjs
          node scripts/valida-cobertura-other-module-registry.cjs
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs

      - name: Apply migration
        run: node scripts/migra-pcr-handoffs-terminais.cjs

      - name: Validate migrated state
        run: |
          node scripts/valida-pcr-handoffs-terminais-pos-migracao.cjs
          node scripts/valida-contagem-transition-contracts.cjs
          node scripts/valida-cobertura-other-module-registry.cjs
          node scripts/valida-handoff-prioridade-pcr.cjs
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs

      - name: Enforce exact migration file allowlist
        run: |
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          acls-bradycardia-tree.ts
          acls-tachycardia-tree.ts
          clinical-safety-cases/target-promotion-debts.ts
          lib/clinical-target-semantics.ts
          lib/clinical-transition-contracts.ts
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          cat /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit migration to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            acls-bradycardia-tree.ts \
            acls-tachycardia-tree.ts \
            clinical-safety-cases/target-promotion-debts.ts \
            lib/clinical-target-semantics.ts \
            lib/clinical-transition-contracts.ts
          git commit -m "feat: promote pulseless arrhythmias to terminal PCR handoffs"
          git push origin HEAD:emergencias-2-ui-core
