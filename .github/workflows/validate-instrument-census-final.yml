name: Validate instrument census final

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/censo-de-instrumentos.cjs
      - .github/workflows/validate-instrument-census-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Re-run after focused corrections until outside-gate failures reach zero.
      # This pass includes the shared input, action, transition, navigation and Drug KB contracts.
      - name: Instrument census and outside-gate diagnosis
        shell: bash
        run: |
          set +e
          npm run test:censo 2>&1 | tee /tmp/censo.log
          census_status=${PIPESTATUS[0]}
          echo "CENSUS_EXIT=${census_status}"

          grep -oE '❌ [^ ]+\.cjs não está alcançável' /tmp/censo.log \
            | awk '{print $2}' \
            | sort -u > /tmp/outside.txt || true

          echo "OUTSIDE_COUNT=$(wc -l < /tmp/outside.txt | tr -d ' ')"
          failures=0
          while IFS= read -r validator; do
            [ -n "$validator" ] || continue
            node "scripts/$validator" > /tmp/validator.log 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
              echo "OUTSIDE_FAIL rc=$rc $validator"
              tail -n 12 /tmp/validator.log || true
            else
              echo "OUTSIDE_PASS $validator"
            fi
          done < /tmp/outside.txt
          echo "OUTSIDE_FAIL_COUNT=$failures"
          exit 0
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: InputStep parity
        run: node scripts/valida-paridade-input-step.cjs
      - name: ActionStep parity
        run: node scripts/valida-paridade-action-step.cjs
      - name: TransitionStep parity
        run: node scripts/valida-paridade-transition-step.cjs
      - name: Input safety, Back and NIHSS
        run: node scripts/valida-seguranca-input-voltar-nihss.cjs
      - name: Alteplase indication isolation
        run: node scripts/valida-drug-knowledge-alteplase.cjs
      - name: Selector policy
        run: node scripts/valida-padrao-seletores-ui.cjs
      - name: Calculator no-fake-default policy
        run: node scripts/valida-sem-fallback-clinico-calculadoras.cjs
      - name: STEMI soft stop
        run: node scripts/valida-safety-gate-soft-stop-stemi.cjs
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Diff sanity
        run: git diff --check HEAD~8..HEAD
