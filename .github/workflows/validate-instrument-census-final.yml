name: Validate instrument census final

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/censo-de-instrumentos.cjs
      - scripts/run-all-instruments-gate.cjs
      - scripts/valida-emergencias-2-suite.cjs
      - scripts/valida-na-duvida.cjs
      - scripts/valida-ordem-clinica-parcial.cjs
      - scripts/valida-eap.cjs
      - scripts/valida-osmolaridade.cjs
      - scripts/valida-farmacos-fonte-unica.cjs
      - lib/na-duvida.ts
      - lib/drug-knowledge/amiodarona.ts
      - tce-decision-tree.ts
      - .github/workflows/validate-instrument-census-final.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instrument census
        run: npm run test:censo
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: TEP uncertainty rule
        run: node scripts/valida-na-duvida.cjs
      - name: Tube confirmation order
        run: node scripts/valida-ordem-clinica-parcial.cjs
      - name: EAP clinical structure
        run: node scripts/valida-eap.cjs
      - name: Osmolarity and TCE formula
        run: node scripts/valida-osmolaridade.cjs
      - name: Drug single-source invariants
        run: node scripts/valida-farmacos-fonte-unica.cjs
      - name: InputStep parity
        run: node scripts/valida-paridade-input-step.cjs
      - name: ActionStep parity
        run: node scripts/valida-paridade-action-step.cjs
      - name: TransitionStep parity
        run: node scripts/valida-paridade-transition-step.cjs
      - name: Input safety, Back and NIHSS
        run: node scripts/valida-seguranca-input-voltar-nihss.cjs
      - name: Alteplase indication isolation
        run: node scripts/valida-drug-knowledge-alteplase.cjs
      - name: Selector policy
        run: node scripts/valida-padrao-seletores-ui.cjs
      - name: Safety surface debts
        run: node scripts/valida-safety-gate-surface-debts.cjs
      - name: PCR migration state
        run: node scripts/valida-migracao-pcr-handoffs-terminais.cjs
      - name: PCR target semantics
        run: node scripts/valida-pcr-target-semantics.cjs
      - name: Target promotion state
        run: node scripts/valida-target-promotion-debts.cjs
      - name: EAP and anaphylaxis transitions
        run: node scripts/valida-transition-contracts-eap-anafilaxia.cjs
      - name: Calculator no-fake-default policy
        run: node scripts/valida-sem-fallback-clinico-calculadoras.cjs
      - name: STEMI soft stop
        run: node scripts/valida-safety-gate-soft-stop-stemi.cjs
      - name: Emergencias 2 regression
        env:
          SKIP_TOTAL_INSTRUMENT_GATE: "1"
        run: npm run test:emergencias-2
      - name: Total instrument gate
        id: total_gate
        shell: bash
        run: |
          set +e
          node scripts/run-all-instruments-gate.cjs 2>&1 | tee instrument-gate.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload instrument gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrument-gate-log
          path: instrument-gate.log
          if-no-files-found: error
      - name: Fail if total instrument gate failed
        if: steps.total_gate.outputs.status != '0'
        run: exit 1
      - name: Diff sanity
        run: git diff --check HEAD~15..HEAD
