name: Remove duplicated UI v2 progress trail

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - '.github/workflows/remove-duplicated-v2-trail.yml'
      - 'scripts/remove-trilha-duplicada-ui-v2.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/remove-trilha-duplicada-ui-v2.cjs
      - run: node scripts/valida-paridade-clinical-steps.cjs
      - run: npm run build:web
      - name: Validate scope
        shell: bash
        run: |
          git diff --check
          files="$(git diff --name-only)"
          echo "$files"
          test "$files" = "components/protocol-screen/acls-decision-flow-screen.tsx"
      - name: Commit shell deduplication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/acls-decision-flow-screen.tsx
          git commit -m "fix(ui-v2): remove duplicated progress trail from shell"
          git push origin HEAD:emergencias-2-ui-core
