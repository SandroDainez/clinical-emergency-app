name: TypeScript clinical core gate

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/*.cjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/typescript-clinical-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-clinical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit --pretty false

      - name: Validate terminal PCR handoffs
        run: |
          node scripts/valida-pcr-handoffs-terminais-pos-migracao.cjs
          node scripts/valida-contagem-transition-contracts.cjs
          node scripts/valida-cobertura-other-module-registry.cjs
          node scripts/valida-handoff-prioridade-pcr.cjs

      - name: Run executable clinical handoff regressions
        run: |
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs

      - name: Validate inherited PCR context
        run: |
          node scripts/valida-pcr-inherited-context-card.cjs
          node scripts/valida-pcr-inherited-context-pos-migracao.cjs
