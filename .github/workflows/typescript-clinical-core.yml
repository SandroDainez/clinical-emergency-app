name: TypeScript clinical core gate

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/*.cjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/typescript-clinical-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-clinical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile gate
        run: npx tsc --noEmit --pretty false

      - name: Validate target semantics
        run: |
          node scripts/valida-target-semantics.cjs
          node scripts/inventario-targets-sem-semantica.cjs
          node scripts/valida-targets-em-handoffs.cjs
          node scripts/valida-targets-versus-handoffs.cjs

      - name: Validate contextual navigation contracts
        run: node scripts/valida-navegacao-contextual-acls.cjs

      - name: Validate active guided discovery contracts
        run: node scripts/valida-guided-discovery-hic-stemi.cjs

      - name: Run action-centered safety gate regressions
        run: node scripts/test-clinical-gate-triggers.cjs

      - name: Validate safety gate interaction surfaces
        run: node scripts/valida-safety-gate-interaction-surfaces.cjs

      - name: Inventory declared safety gate interactions
        run: node scripts/inventario-safety-gate-interactions.cjs

      - name: Guard safety gate candidate debts
        run: node scripts/valida-safety-gate-candidate-debts.cjs

      - name: Guard cross-module safety gate surface debts
        run: node scripts/valida-safety-gate-surface-debts.cjs

      - name: Validate toxic alcohol evidence-reviewed copy
        run: node scripts/valida-toxic-alcohol-decontamination-copy.cjs

      - name: Validate decision observation bindings
        run: node scripts/valida-decision-observation-bindings.cjs

      - name: Validate decision-scoped observation freshness
        run: node scripts/valida-observacao-stale-por-decisao.cjs

      - name: Validate tachycardia SafetyGate advisory
        run: node scripts/valida-safety-gate-advisory-taquicardia.cjs

      - name: Validate AVC SafetyGate hard stop
        run: node scripts/valida-safety-gate-hard-stop-avc.cjs

      - name: Validate STEMI SafetyGate soft stop
        run: node scripts/valida-safety-gate-soft-stop-stemi.cjs

      - name: Validate runtime bridge instrumentation
        run: |
          node scripts/valida-clinical-runtime-bridge.cjs
          node scripts/valida-clinical-runtime-bridge-shell.cjs

      - name: Validate terminal PCR handoffs
        run: |
          node scripts/valida-pcr-handoffs-terminais-pos-migracao.cjs
          node scripts/valida-contagem-transition-contracts.cjs
          node scripts/valida-cobertura-other-module-registry.cjs
          node scripts/valida-handoff-prioridade-pcr.cjs
          node scripts/valida-terminal-handoff-navigation-shell.cjs

      - name: Run executable clinical handoff regressions
        run: |
          node scripts/valida-handoff-executaveis-emergencias-2.cjs
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs

      - name: Validate inherited PCR context
        run: |
          node scripts/valida-pcr-inherited-context-card.cjs
          node scripts/valida-pcr-inherited-context-pos-migracao.cjs
