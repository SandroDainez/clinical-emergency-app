name: One-shot contextual navigation migration

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - ".github/workflows/apply-context-navigation-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core

      - name: Apply deterministic migration
        run: node scripts/apply-context-navigation-consumer-migration.cjs

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/acls-protocol-screen.tsx \
                  components/protocol-screen/acls-choking-screen.tsx \
                  components/protocol-screen/acls-pregnancy-screen.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "refactor(orchestrator): migrate ACLS contextual navigation consumers"
          git push origin HEAD:emergencias-2-ui-core
