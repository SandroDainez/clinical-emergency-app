name: Finalize TCE and Shock 2026 clinical consolidation v2

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - scripts/corrige-valida-choque-iam-vd-2026.cjs
      - .github/workflows/finalize-tce-choque-2026-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final migrations and validator semantic repair
        run: |
          node scripts/finaliza-tce-choque-2026.cjs
          node scripts/corrige-valida-choque-iam-vd-2026.cjs
      - name: TCE focused clinical gates
        run: |
          node scripts/valida-tce-neuromonitorizacao-handoff-acs2024.cjs
          node scripts/valida-tce-osmoterapia-2026.cjs
          node scripts/valida-tce-monitorizacao-uti-2026.cjs
      - name: Shock focused clinical gates
        run: |
          node scripts/valida-choque-avaliacao-ressuscitacao-esicm2025.cjs
          node scripts/valida-choque-hemorragico-esicm2025.cjs
          node scripts/valida-choque-obstrutivo-erc2025.cjs
          node scripts/valida-choque-cardiogenico-acc2025.cjs
          node scripts/valida-choque-distributivo-ssc2026.cjs
          node scripts/valida-choque-valvar-mecanico-2026.cjs
      - name: Install dependencies
        run: npm ci
      - name: Existing TCE and shock regressions
        run: |
          npm run test:tce
          npm run test:choque
          npm run test:vasoativos
          npm run test:tep
          npm run test:coronarias
      - name: Emergencias 2 architecture suite
        run: npm run test:emergencias-2
      - name: Scoped TypeScript compile
        run: npx tsc --module node16 --target es2020 --esModuleInterop --moduleResolution node16 --skipLibCheck --outDir /tmp/final-clinical tce-decision-tree.ts shock-decision-tree.ts lib/clinical-transition-contracts.ts lib/clinical-target-semantics.ts lib/clinical-handoff-target-semantics.ts
      - name: Scope and whitespace gate
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(tce-decision-tree\.ts|shock-decision-tree\.ts|lib/i18n/modules/(tce|choque)\.ts|lib/clinical-transition-contracts\.ts|scripts/valida-choque\.cjs)$' || true)"
          test -z "$bad" || { echo "Unexpected generated scope:"; echo "$bad"; exit 1; }
      - name: Commit final clinical consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tce-decision-tree.ts shock-decision-tree.ts lib/i18n/modules/tce.ts lib/i18n/modules/choque.ts lib/clinical-transition-contracts.ts scripts/valida-choque.cjs
          git diff --cached --quiet && exit 0
          git commit -m "fix(clinical): consolidate TCE and shock 2026 safety"
          git pull --rebase origin emergencias-2-ui-core
          git push origin HEAD:emergencias-2-ui-core
