name: Validate roadmap terminal coverage sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core

      - name: Verify roadmap is already synchronized
        run: |
          node scripts/atualiza-roadmap-pos-terminal-coverage.cjs
          if ! git diff --quiet; then
            echo "Roadmap terminal coverage drift detected."
            git diff -- EMERGENCIAS-2-ROADMAP.md
            exit 1
          fi
          echo "Roadmap terminal coverage is synchronized."
