name: Apply AVC operational actions wave 2

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-avc-acoes-operacionais-wave2.cjs
      - .github/workflows/apply-avc-actions-wave2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove accidental no-op assertion from temporary mutator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ajusta-avc-acoes-operacionais-wave2.cjs')
          s = p.read_text()
          old = '''once(`      actions: [\n        "Alteplase: dose total {alteplaseDose} mg (0,9 mg/kg, máx 90 mg) — {alteplaseBolus} mg em bolus em 1 min (10%) + {alteplaseInfusao} mg em infusão por 60 min.",`, `      actions: [\n        "Alteplase: dose total {alteplaseDose} mg (0,9 mg/kg, máx 90 mg) — {alteplaseBolus} mg em bolus em 1 min (10%) + {alteplaseInfusao} mg em infusão por 60 min.",`, 'âncora trombólise');\n'''
          if old not in s:
              raise SystemExit('No-op anchor not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Apply AVC operational actions wave 2
        run: node scripts/ajusta-avc-acoes-operacionais-wave2.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: UI patterns
        run: npm run test:padroes-ui
      - name: AVC regression
        run: npm run test:avc
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git checkout -- scripts/ajusta-avc-acoes-operacionais-wave2.cjs
          git diff --check
          test "$(git diff --name-only)" = "avc-decision-tree.ts"
      - name: Commit validated AVC operational actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avc-decision-tree.ts
          git commit -m "Make remaining AVC actions operational and traceable"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
