name: Apply AVC pending states

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-avc-estados-pendentes.cjs
      - .github/workflows/apply-avc-pending-states.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply AVC pending-state controls
        run: node scripts/ajusta-avc-estados-pendentes.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: UI patterns
        run: npm run test:padroes-ui
      - name: AVC regression
        run: npm run test:avc
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "avc-decision-tree.ts"
      - name: Commit validated AVC pending states
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avc-decision-tree.ts
          git commit -m "Record pending and unavailable states in AVC actions"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
