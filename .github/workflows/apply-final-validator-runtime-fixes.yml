name: Apply final validator/runtime fixes

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-validadores-e-runtime-deploy.cjs
      - .github/workflows/apply-final-validator-runtime-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply scoped fixes
        run: node scripts/ajusta-validadores-e-runtime-deploy.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: ISR validator
        run: node scripts/valida-isr.cjs
      - name: Composed translation non-regression
        run: node scripts/valida-traducao-composta-debt.cjs
      - name: Reachability validator
        run: node scripts/valida-alcancabilidade.cjs
      - name: Runtime translation debt
        run: node scripts/valida-traducao-runtime-debt.cjs
      - name: Amiodarone Drug KB validator
        run: node scripts/valida-drug-knowledge-amiodarona.cjs
      - name: Validate scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' lib/i18n/modules/pr18-convergence.ts scripts/valida-alcancabilidade.cjs scripts/valida-isr.cjs scripts/valida-traducao-composta.cjs | sort)"
          test "$changed" = "$expected"
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/i18n/modules/pr18-convergence.ts scripts/valida-alcancabilidade.cjs scripts/valida-isr.cjs scripts/valida-traducao-composta.cjs
          git commit -m "Fix final validator drift and runtime debt regressions"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
