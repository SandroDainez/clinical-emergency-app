name: Apply sedation stepper range final

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-faixa-stepper-sedacao-final.cjs
      - .github/workflows/apply-sedation-stepper-range-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply sedation stepper range fix
        run: node scripts/ajusta-faixa-stepper-sedacao-final.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Stepper grid regression
        run: npm run test:faixa-do-stepper
      - name: Sedation regression
        run: npm run test:sedacao
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "sedation-engine.ts"
      - name: Commit validated sedation stepper range fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sedation-engine.ts
          git commit -m "Align sedation slider maxima to step grid"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
