name: Diagnose i18n baseline

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/diagnose-i18n-baseline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          path: base
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          path: current
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: current/package-lock.json
      - name: Install base
        working-directory: base
        run: npm ci
      - name: Install current
        working-directory: current
        run: npm ci
      - name: Measure base i18n debt
        working-directory: base
        shell: bash
        run: |
          set +e
          npm run test:i18n 2>&1 | tee /tmp/base-i18n.log
          code=${PIPESTATUS[0]}
          count=$(grep -oE 'SEM TRADUÇÃO: [0-9]+' /tmp/base-i18n.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "BASE_I18N_COUNT=${count:-unknown}"
          echo "BASE_I18N_EXIT=$code"
          exit 0
      - name: Measure current i18n debt
        working-directory: current
        shell: bash
        run: |
          set +e
          npm run test:i18n 2>&1 | tee /tmp/current-i18n.log
          code=${PIPESTATUS[0]}
          count=$(grep -oE 'SEM TRADUÇÃO: [0-9]+' /tmp/current-i18n.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "CURRENT_I18N_COUNT=${count:-unknown}"
          echo "CURRENT_I18N_EXIT=$code"
          exit 0
      - name: Compare exact untranslated literals
        shell: bash
        run: |
          sed -n '/== /,$p' /tmp/base-i18n.log | grep '^   ' | sed 's/^   //' | sort -u > /tmp/base-literals.txt || true
          sed -n '/== /,$p' /tmp/current-i18n.log | grep '^   ' | sed 's/^   //' | sort -u > /tmp/current-literals.txt || true
          echo '=== NEW UNTRANSLATED LITERALS ON CURRENT ==='
          comm -13 /tmp/base-literals.txt /tmp/current-literals.txt || true
          echo '=== END NEW LITERALS ==='
