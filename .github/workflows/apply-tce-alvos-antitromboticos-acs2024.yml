name: Apply TCE ACS 2024 target and antithrombotic corrections

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - scripts/ajusta-tce-alvos-antitromboticos-acs2024.cjs
      - scripts/valida-tce-alvos-antitromboticos-acs2024.cjs
      - .github/workflows/apply-tce-alvos-antitromboticos-acs2024.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply deterministic TCE correction
        run: node scripts/ajusta-tce-alvos-antitromboticos-acs2024.cjs
      - name: Validate focused TCE corrections
        run: node scripts/valida-tce-alvos-antitromboticos-acs2024.cjs
      - name: Existing TCE regression
        run: npm run test:tce
      - name: Ventilation consistency
        run: npm run test:vm
      - name: Translation gates
        run: |
          npm run test:i18n
          npm run test:traducao-runtime
      - name: TypeScript compile gate
        run: npx tsc --noEmit --pretty false
      - name: Validate scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          echo "$changed"
          expected="$(printf '%s\n' lib/alvos-tce.ts lib/i18n/modules/tce.ts tce-decision-tree.ts | sort)"
          test "$changed" = "$expected"
      - name: Commit TCE correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/alvos-tce.ts lib/i18n/modules/tce.ts tce-decision-tree.ts
          git commit -m "fix(tce): align targets and antithrombotic safety with ACS 2024"
          git pull --rebase origin emergencias-2-ui-core
          git push origin HEAD:emergencias-2-ui-core
