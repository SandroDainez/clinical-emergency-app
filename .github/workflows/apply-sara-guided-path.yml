name: Apply guided SARA severity path

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-sara-caminho-guiado.cjs
      - .github/workflows/apply-sara-guided-path.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guided SARA path
        run: node scripts/ajusta-sara-caminho-guiado.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: UI interaction-pattern audit
        run: npm run test:padroes-ui
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "eap-decision-tree.ts"
      - name: Commit validated SARA path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eap-decision-tree.ts
          git commit -m "Add guided SARA severity reassessment"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
