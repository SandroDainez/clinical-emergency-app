name: Apply ClinicalShellHost migration

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - ".github/workflows/apply-clinical-shell-host.yml"

permissions:
  contents: write

jobs:
  apply-shell-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate prepared migration and compile current state
        run: |
          node scripts/valida-migracao-clinical-shell-host.cjs
          npx tsc --noEmit --pretty false

      - name: Apply ClinicalShellHost migration
        run: node scripts/migra-clinical-shell-host.cjs

      - name: Validate migrated shell and compile
        run: |
          node scripts/valida-clinical-shell-host-pos-migracao.cjs
          npx tsc --noEmit --pretty false

      - name: Enforce exact migration file allowlist
        run: |
          git diff --name-only | sort > /tmp/actual-files.txt
          printf '%s\n' 'components/protocol-screen/acls-decision-flow-screen.tsx' > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Run clinical regression gates
        run: |
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs
          node scripts/valida-pcr-inherited-context-pos-migracao.cjs

      - name: Commit migration to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/acls-decision-flow-screen.tsx
          git commit -m "feat: integrate ClinicalShellHost into shared decision flow"
          git push origin HEAD:emergencias-2-ui-core
