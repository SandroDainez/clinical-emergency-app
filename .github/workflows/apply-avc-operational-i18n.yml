name: Apply AVC operational i18n

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-i18n-avc-operacional.cjs
      - .github/workflows/apply-avc-operational-i18n.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply AVC operational translations
        run: node scripts/ajusta-i18n-avc-operacional.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Source i18n non-regression
        run: node scripts/valida-i18n-debt.cjs
      - name: Runtime i18n non-regression
        run: node scripts/valida-traducao-runtime-debt.cjs
      - name: AVC regression
        run: npm run test:avc
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/i18n/modules/pr18-convergence.ts"
      - name: Commit validated translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/i18n/modules/pr18-convergence.ts
          git commit -m "Translate operational AVC interaction states"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
