name: Apply TCE neuromonitoring handoff ACS 2024 checkpoint v2

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - scripts/valida-tce-osmoterapia-2026.cjs
      - scripts/valida-tce-monitorizacao-uti-2026.cjs
      - .github/workflows/apply-tce-neuromonitorizacao-handoff-acs2024-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply TCE neuromonitoring handoff checkpoint
        run: node scripts/ajusta-tce-neuromonitorizacao-handoff-acs2024.cjs
      - name: Focused TCE validation
        run: node scripts/valida-tce-neuromonitorizacao-handoff-acs2024.cjs
      - name: Existing TCE regression
        run: npm run test:tce
      - name: Updated TCE osmotherapy validator
        run: node scripts/valida-tce-osmoterapia-2026.cjs
      - name: Updated TCE ICU monitoring validator
        run: node scripts/valida-tce-monitorizacao-uti-2026.cjs
      - name: Emergencias 2 architecture suite
        run: npm run test:emergencias-2
      - name: Scoped TypeScript compile
        run: npx tsc --module node16 --target es2020 --esModuleInterop --moduleResolution node16 --skipLibCheck --outDir /tmp/tce-final tce-decision-tree.ts lib/alvos-tce.ts lib/pas-no-tce.ts lib/clinical-transitions.ts
      - name: Validate scope
        run: git diff --check
      - name: Commit validated TCE closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tce-decision-tree.ts lib/i18n/modules/tce.ts lib/clinical-transitions.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(tce): finalize neuromonitoring and neurosurgical handoff"
          git pull --rebase origin emergencias-2-ui-core
          git push origin HEAD:emergencias-2-ui-core
