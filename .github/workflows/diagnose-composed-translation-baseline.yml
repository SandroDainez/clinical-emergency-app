name: Diagnose composed translation baseline

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/diagnose-composed-translation-baseline.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          path: base
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          path: current
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: current/package-lock.json
      - name: Install base
        working-directory: base
        run: npm ci
      - name: Install current
        working-directory: current
        run: npm ci
      - name: Make legacy validator compile on base
        working-directory: base
        run: sed -i 's/"tsc", "--ignoreConfig",/"tsc",/' scripts/valida-traducao-composta.cjs
      - name: Measure base
        working-directory: base
        shell: bash
        run: |
          set +e
          node scripts/valida-traducao-composta.cjs 2>&1 | tee /tmp/base-composed.log
          echo "BASE_EXIT=${PIPESTATUS[0]}"
          exit 0
      - name: Make legacy validator compile on current
        working-directory: current
        run: sed -i 's/"tsc", "--ignoreConfig",/"tsc",/' scripts/valida-traducao-composta.cjs || true
      - name: Measure current
        working-directory: current
        shell: bash
        run: |
          set +e
          node scripts/valida-traducao-composta.cjs 2>&1 | tee /tmp/current-composed.log
          echo "CURRENT_EXIT=${PIPESTATUS[0]}"
          exit 0
      - name: Show module debt summary
        shell: bash
        run: |
          echo '=== BASE ==='
          grep -E '^❌ [a-z0-9-]+: [0-9]+ frase' /tmp/base-composed.log || true
          echo '=== CURRENT ==='
          grep -E '^❌ [a-z0-9-]+: [0-9]+ frase' /tmp/current-composed.log || true
