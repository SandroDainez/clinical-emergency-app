name: Apply shock hypovolemia ESICM 2025

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-choque-hipovolemia-esicm2025.cjs
      - .github/workflows/apply-choque-hipovolemia-esicm2025.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply ESICM 2025 hypovolemia correction
        run: node scripts/ajusta-choque-hipovolemia-esicm2025.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Focused ESICM hypovolemia validator
        run: node scripts/valida-choque-hipovolemia-avaliacao-integrada-esicm2025.cjs
      - name: Shock regression
        run: npm run test:choque
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'lib/i18n/modules/choque-einstein.ts\nshock-decision-tree.ts'
      - name: Commit validated clinical correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shock-decision-tree.ts lib/i18n/modules/choque-einstein.ts
          git commit -m "Align hypovolemia assessment with ESICM 2025"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
