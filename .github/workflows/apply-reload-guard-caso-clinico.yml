name: Apply fail-closed clinical reload guard

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - lib/clinical-case-reload-marker.ts
      - components/clinical-case-recovery-gate.tsx
      - scripts/aplica-reload-guard-caso-clinico.cjs
      - scripts/valida-reload-guard-caso-clinico.cjs
      - .github/workflows/apply-reload-guard-caso-clinico.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply reload guard
        run: node scripts/aplica-reload-guard-caso-clinico.cjs
      - name: Validate reload guard
        run: node scripts/valida-reload-guard-caso-clinico.cjs
      - name: Run Emergencias 2 baseline
        run: npm run test:emergencias-2
      - name: Run executable safety gate regressions
        run: node scripts/test-clinical-gate-triggers.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Web export smoke test
        run: npm run build:web
      - name: Scope and whitespace gate
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' components/clinical-app.tsx lib/clinical-session-runtime.ts | sort)"
          test "$changed" = "$expected"
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/clinical-app.tsx lib/clinical-session-runtime.ts
          git commit -m 'fix(state): block silent restart after clinical reload'
          git push origin HEAD:emergencias-2-ui-core
