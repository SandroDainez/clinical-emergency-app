name: Restore TCE absence declaration

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-ausencia-hiperventilacao-tce.cjs
      - .github/workflows/apply-tce-absence-declaration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply TCE absence declaration
        run: node scripts/ajusta-ausencia-hiperventilacao-tce.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Declared absences
        run: npm run test:ausencias
      - name: TCE regression
        run: npm run test:tce
      - name: Source i18n debt
        run: node scripts/valida-i18n-debt.cjs
      - name: Runtime i18n debt
        run: node scripts/valida-traducao-runtime-debt.cjs
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/alvos-tce.ts"
      - name: Commit validated TCE declaration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/alvos-tce.ts
          git commit -m "Restore explicit TCE hyperventilation boundary"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
