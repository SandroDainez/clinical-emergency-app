name: ClinicalShellHost migration simulation

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "components/ui-v2/clinical-shell-host.tsx"
      - "components/ui-v2/index.ts"
      - "components/protocol-screen/acls-decision-flow-screen.tsx"
      - "scripts/migra-clinical-shell-host.cjs"
      - "scripts/valida-migracao-clinical-shell-host.cjs"
      - "scripts/valida-clinical-shell-host-pos-migracao.cjs"
      - ".github/workflows/clinical-shell-host-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate-shell-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate prepared migration
        run: node scripts/valida-migracao-clinical-shell-host.cjs

      - name: TypeScript before migration
        run: npx tsc --noEmit --pretty false

      - name: Simulate ClinicalShellHost migration
        run: node scripts/migra-clinical-shell-host.cjs

      - name: Validate migrated shell
        run: node scripts/valida-clinical-shell-host-pos-migracao.cjs

      - name: Enforce exact migration allowlist
        run: |
          git diff --name-only | sort > /tmp/actual-files.txt
          printf '%s\n' 'components/protocol-screen/acls-decision-flow-screen.tsx' > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: TypeScript after migration
        run: npx tsc --noEmit --pretty false

      - name: Confirm simulation is workspace-only
        run: |
          test -n "$(git status --short)"
          git status --short
