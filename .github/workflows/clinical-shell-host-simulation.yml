name: ClinicalShellHost validation

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "components/ui-v2/clinical-shell-host.tsx"
      - "components/ui-v2/clinical-shell-chrome.tsx"
      - "components/ui-v2/index.ts"
      - "components/protocol-screen/acls-decision-flow-screen.tsx"
      - "lib/clinical-shell-adapter.ts"
      - "lib/clinical-crisis-routing.ts"
      - "scripts/valida-migracao-clinical-shell-host.cjs"
      - "scripts/valida-clinical-shell-host-pos-migracao.cjs"
      - ".github/workflows/clinical-shell-host-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-shell-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate integrated ClinicalShellHost
        run: |
          node scripts/valida-migracao-clinical-shell-host.cjs
          node scripts/valida-clinical-shell-host-pos-migracao.cjs

      - name: TypeScript compile gate
        run: npx tsc --noEmit --pretty false

      - name: Run clinical regression gates
        run: |
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs
          node scripts/valida-pcr-inherited-context-pos-migracao.cjs
