name: Apply target semantics lote 2

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "scripts/migra-target-semantics-lote2.cjs"
      - ".github/workflows/apply-target-semantics-lote2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript before migration
        run: npx tsc --noEmit --pretty false

      - name: Apply target semantics migration
        run: node scripts/migra-target-semantics-lote2.cjs

      - name: Validate complete terminal target inventory
        run: |
          node scripts/valida-target-semantics.cjs
          node scripts/inventario-targets-sem-semantica.cjs
          node scripts/valida-targets-versus-handoffs.cjs

      - name: TypeScript after migration
        run: npx tsc --noEmit --pretty false

      - name: Enforce exact allowlist
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "lib/clinical-target-semantics.ts"

      - name: Commit migrated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/clinical-target-semantics.ts
          git commit -m "feat: classify remaining terminal targets"
          git push origin HEAD:emergencias-2-ui-core
