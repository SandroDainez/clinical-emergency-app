name: Apply TCE absence declaration final

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-ausencia-hiperventilacao-tce-final.cjs
      - .github/workflows/apply-tce-absence-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply TCE absence declaration + translation
        run: node scripts/ajusta-ausencia-hiperventilacao-tce-final.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Declared absences
        run: npm run test:ausencias
      - name: Source i18n non-regression
        run: node scripts/valida-i18n-debt.cjs
      - name: Runtime i18n non-regression
        run: node scripts/valida-traducao-runtime-debt.cjs
      - name: TCE regression
        run: npm run test:tce
      - name: Validate scope
        run: |
          git diff --check
          printf '%s\n' 'lib/alvos-tce.ts' 'lib/i18n/modules/tce-alvos.ts' > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Commit validated TCE declaration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/alvos-tce.ts lib/i18n/modules/tce-alvos.ts
          git commit -m "Restore explicit TCE hyperventilation evidence boundary"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
