name: Apply composed phrases final

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-frases-compostas-final.cjs
      - .github/workflows/apply-composed-phrases-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply composed phrase fixes
        run: node scripts/ajusta-frases-compostas-final.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Composed phrase guard
        run: npm run test:frase-composta
      - name: Source i18n non-regression
        run: node scripts/valida-i18n-debt.cjs
      - name: Runtime i18n non-regression
        run: node scripts/valida-traducao-runtime-debt.cjs
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          printf '%s\n' \
            'components/protocol-screen/pcr-inherited-context-card.tsx' \
            'lib/clinical-reassessment-runtime.ts' \
            'lib/clinical-safety-override.ts' \
            'lib/clinical-shell-adapter.ts' \
            'lib/i18n/modules/pr18-convergence.ts' | sort > /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
      - name: Commit validated composed phrase fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/pcr-inherited-context-card.tsx \
            lib/clinical-reassessment-runtime.ts \
            lib/clinical-safety-override.ts \
            lib/clinical-shell-adapter.ts \
            lib/i18n/modules/pr18-convergence.ts
          git commit -m "Translate new composed clinical UI phrases"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
