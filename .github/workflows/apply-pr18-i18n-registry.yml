name: Register PR18 convergence translations

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - .github/workflows/apply-pr18-i18n-registry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register translation module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/i18n/index.ts')
          s = p.read_text()
          imp_anchor = 'import { ES_FRASES_MONTADAS } from "./modules/frases-montadas-em-runtime";\n'
          new_imp = imp_anchor + 'import { ES_PR18_CONVERGENCE } from "./modules/pr18-convergence";\n'
          if 'ES_PR18_CONVERGENCE' not in s:
              if imp_anchor not in s:
                  raise SystemExit('Import anchor not found')
              s = s.replace(imp_anchor, new_imp, 1)
          ret_anchor = 'return ES_STRINGS[pt] ??'
          if 'return ES_PR18_CONVERGENCE[pt] ??' not in s:
              if ret_anchor not in s:
                  raise SystemExit('Translation return anchor not found')
              s = s.replace(ret_anchor, 'return ES_PR18_CONVERGENCE[pt] ?? ES_STRINGS[pt] ??', 1)
          p.write_text(s)
          PY
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: i18n debt measurement
        shell: bash
        run: |
          set +e
          npm run test:i18n 2>&1 | tee /tmp/i18n.log
          code=${PIPESTATUS[0]}
          count=$(grep -oE 'SEM TRADUÇÃO: [0-9]+' /tmp/i18n.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "I18N_COUNT=${count:-unknown}"
          test -n "$count"
          test "$count" -le 585
      - name: Runtime translation validation
        run: npm run test:i18n-runtime
      - name: Validate scope
        run: |
          git diff --check
          test "$(git diff --name-only)" = "lib/i18n/index.ts"
      - name: Commit registry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/i18n/index.ts
          git commit -m "Register PR18 Spanish convergence translations"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
