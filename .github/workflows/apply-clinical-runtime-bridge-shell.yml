name: Apply Clinical Runtime Bridge to shared shell

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - ".github/workflows/apply-clinical-runtime-bridge-shell.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile before migration
        run: npx tsc --noEmit --pretty false

      - name: Validate bridge boundary before integration
        run: node scripts/valida-clinical-runtime-bridge.cjs

      - name: Apply exact-context migration
        run: node scripts/migra-clinical-runtime-bridge-shell.cjs

      - name: Validate shell integration
        run: node scripts/valida-clinical-runtime-bridge-shell.cjs

      - name: TypeScript compile after migration
        run: npx tsc --noEmit --pretty false

      - name: Run clinical regressions
        run: |
          node scripts/test-clinical-gate-triggers.cjs
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs
          node scripts/valida-guided-discovery-hic-stemi.cjs

      - name: Guard migration allowlist
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=("components/protocol-screen/acls-decision-flow-screen.tsx")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Unexpected migration diff"
            exit 1
          fi

      - name: Commit guarded migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/acls-decision-flow-screen.tsx
          git commit -m "feat: record shared flow events and observations"
          git push origin HEAD:emergencias-2-ui-core
