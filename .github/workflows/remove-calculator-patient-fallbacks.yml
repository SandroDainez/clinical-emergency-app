name: Remove calculator patient fallbacks

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - scripts/remove-fallbacks-clinicos-calculadoras.cjs
      - scripts/valida-sem-fallback-clinico-calculadoras.cjs
      - .github/workflows/remove-calculator-patient-fallbacks.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: node scripts/remove-fallbacks-clinicos-calculadoras.cjs
      - run: node scripts/valida-sem-fallback-clinico-calculadoras.cjs
      - run: node scripts/valida-paridade-clinical-steps.cjs
      - run: npm run build:web

      - name: Validate scope
        run: |
          CHANGED=$(git diff --name-only | sort)
          echo "$CHANGED"
          EXPECTED=$(printf '%s\n' \
            components/protocol-screen/sedation-calculator-screen.tsx \
            components/protocol-screen/vasoactive-calculator-screen.tsx \
            components/protocol-screen/ventilator-configurator-card.tsx | sort)
          test "$CHANGED" = "$EXPECTED"

      - name: Commit patient-value safety fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/sedation-calculator-screen.tsx \
                  components/protocol-screen/vasoactive-calculator-screen.tsx \
                  components/protocol-screen/ventilator-configurator-card.tsx
          git commit -m "fix(safety): keep calculator patient values empty until informed"
          git pull --rebase origin emergencias-2-ui-core
          git push origin HEAD:emergencias-2-ui-core
