name: Fix build sedation calculator

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - scripts/corrige-sintaxe-sedation-diluicoes.cjs
      - .github/workflows/fix-build-sedation-calculator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair sedation calculator syntax
        run: node scripts/corrige-sintaxe-sedation-diluicoes.cjs
      - name: Scoped TypeScript compile
        run: npx tsc --module node16 --target es2020 --jsx react-jsx --esModuleInterop --moduleResolution node16 --skipLibCheck --outDir /tmp/sedation-build components/protocol-screen/sedation-calculator-screen.tsx
      - name: Web export smoke test
        run: npm run build:web
      - name: Scope and whitespace gate
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          echo "$changed"
          expected="components/protocol-screen/sedation-calculator-screen.tsx"
          test "$changed" = "$expected"
      - name: Commit build repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/sedation-calculator-screen.tsx
          git commit -m "fix(build): repair sedation calculator translation string"
          git pull --rebase origin emergencias-2-ui-core
          git push origin HEAD:emergencias-2-ui-core
