name: Apply clinical case boundary repair

on:
  push:
    branches: [emergencias-2-ui-core]
    paths:
      - scripts/corrige-boundary-caso-clinico.cjs
      - scripts/valida-boundary-caso-clinico.cjs
      - .github/workflows/apply-boundary-caso-clinico.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply clinical case boundary repair
        run: node scripts/corrige-boundary-caso-clinico.cjs
      - name: Validate clinical case boundary and resume identity
        run: node scripts/valida-boundary-caso-clinico.cjs
      - name: Run Emergencias 2 baseline
        run: npm run test:emergencias-2
      - name: Run executable safety gate regressions
        run: node scripts/test-clinical-gate-triggers.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: Scope and whitespace gate
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app/modulos/'[id].tsx' components/clinical-app.tsx lib/clinical-session-runtime.ts lib/module-session-navigation.ts | sort)"
          test "$changed" = "$expected"
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/modulos/'[id].tsx' components/clinical-app.tsx lib/clinical-session-runtime.ts lib/module-session-navigation.ts
          git commit -m 'fix(state): bind clinical runtime to patient case identity'
          git push origin HEAD:emergencias-2-ui-core
