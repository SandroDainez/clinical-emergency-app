name: Apply guided discovery HIC STEMI

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - ".github/workflows/apply-guided-discovery-hic-stemi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile before migration
        run: npx tsc --noEmit --pretty false

      - name: Apply exact-context migration
        run: node scripts/migra-guided-discovery-hic-stemi.cjs

      - name: Validate guided discovery contracts
        run: node scripts/valida-guided-discovery-hic-stemi.cjs

      - name: TypeScript compile after migration
        run: npx tsc --noEmit --pretty false

      - name: Guard migration allowlist
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            "avc-decision-tree.ts"
            "components/protocol-screen/acls-decision-flow-screen.tsx"
            "core/decision-tree/engine.ts"
            "core/decision-tree/types.ts"
            "coronary-decision-tree.ts"
            "lib/guided-discovery-registry.ts"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected_sorted[@]}")" ]]; then
            echo "Unexpected migration diff"
            exit 1
          fi

      - name: Commit guarded migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avc-decision-tree.ts coronary-decision-tree.ts \
            core/decision-tree/types.ts core/decision-tree/engine.ts \
            components/protocol-screen/acls-decision-flow-screen.tsx \
            lib/guided-discovery-registry.ts
          git commit -m "feat: activate guided discovery for HIC and STEMI"
          git push origin HEAD:emergencias-2-ui-core
