name: Apply ISR NMBA and ventilation coherence

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[isr-nmba-ventilation-coherence-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply ISR NMBA and ventilation coherence migration
        run: node scripts/aplica-isr-coerencia-bnm-ventilacao.cjs

      - name: Validate ISR module
        run: npm run test:isr

      - name: Validate ISR NMBA and ventilation coherence
        run: node scripts/valida-isr-coerencia-bnm-ventilacao.cjs

      - name: Validate ISR preoxygenation 2026
        run: node scripts/valida-isr-preoxigenacao-2026.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No ISR coherence changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rsi-decision-tree.ts lib/i18n/modules/isr.ts
          git commit -m "align ISR NMBA prose and peri-induction ventilation [isr-nmba-ventilation-coherence-applied]"
          git push origin HEAD:emergencias-2-ui-core
