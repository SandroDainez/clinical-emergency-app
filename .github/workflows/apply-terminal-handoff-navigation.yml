name: Apply anaphylaxis NMBA choice semantics

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[anaphylaxis-nmba-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply anaphylaxis NMBA choice migration
        run: node scripts/aplica-anafilaxia-bnm-escolha-update.cjs

      - name: Diagnose RSI TypeScript compilation
        run: |
          rm -rf /tmp/rsi-debug && mkdir -p /tmp/rsi-debug
          tsc --ignoreConfig --module node16 --target es2020 --resolveJsonModule --esModuleInterop --moduleResolution node16 --skipLibCheck --outDir /tmp/rsi-debug rsi-decision-tree.ts

      - name: Validate RSI module
        run: npm run test:isr

      - name: Validate anaphylaxis NMBA semantics
        run: node scripts/valida-anafilaxia-bnm-escolha.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No anaphylaxis NMBA changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/doses-isr.ts
          git commit -m "remove unsupported anaphylaxis NMBA hierarchy [anaphylaxis-nmba-applied]"
          git push origin HEAD:emergencias-2-ui-core
