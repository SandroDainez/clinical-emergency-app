name: Apply ISR hemodynamic optimization 2026

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[isr-hemodynamics-2026-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply ISR hemodynamic optimization migration
        run: node scripts/aplica-isr-hemodinamica-pretratamento-2026.cjs

      - name: Validate ISR module
        run: npm run test:isr

      - name: Validate ISR hemodynamic optimization 2026
        run: node scripts/valida-isr-hemodinamica-pretratamento-2026.cjs

      - name: Validate prior ISR gates
        run: |
          node scripts/valida-isr-preoxigenacao-2026.cjs
          node scripts/valida-isr-coerencia-bnm-ventilacao.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No ISR hemodynamic changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rsi-decision-tree.ts lib/doses-isr.ts lib/i18n/modules/isr.ts scripts/valida-isr.cjs
          git commit -m "update ISR hemodynamic optimization and pretreatment [isr-hemodynamics-2026-applied]"
          git push origin HEAD:emergencias-2-ui-core
