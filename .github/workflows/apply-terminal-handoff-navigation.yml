name: Apply VM final safety cleanup 2026

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[vm-final-cleanup-2026-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply VM final cleanup
        run: |
          node scripts/aplica-vm-fechamento-2026.cjs
          node scripts/ajusta-vm-fechamento-i18n-2026.cjs

      - name: Validate ventilation module
        run: npm run test:vm

      - name: Validate VM final cleanup 2026
        run: node scripts/valida-vm-fechamento-2026.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No VM final cleanup changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ventilation-decision-tree.ts lib/i18n/modules/ventilacao.ts
          git commit -m "finalize normal-lung VAP tracheostomy and post-extubation VM safety [vm-final-cleanup-2026-applied]"
          git push origin HEAD:emergencias-2-ui-core
