name: Apply terminal handoff navigation

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "scripts/migra-terminal-handoff-navigation-shell.cjs"
      - "scripts/valida-terminal-handoff-navigation-shell.cjs"
      - ".github/workflows/apply-terminal-handoff-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript before migration
        run: npx tsc --noEmit --pretty false

      - name: Handoff regressions before migration
        run: |
          node scripts/valida-handoff-executaveis-emergencias-2.cjs
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs

      - name: Apply shell migration
        run: node scripts/migra-terminal-handoff-navigation-shell.cjs

      - name: Validate shell handoff boundary
        run: node scripts/valida-terminal-handoff-navigation-shell.cjs

      - name: TypeScript after migration
        run: npx tsc --noEmit --pretty false

      - name: Handoff regressions after migration
        run: |
          node scripts/valida-handoff-executaveis-emergencias-2.cjs
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs
          node scripts/valida-pcr-inherited-context-pos-migracao.cjs

      - name: Enforce exact allowlist
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "components/protocol-screen/acls-decision-flow-screen.tsx"

      - name: Commit shell navigation integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/acls-decision-flow-screen.tsx
          git commit -m "feat: publish registered handoff context before navigation"
          git push origin HEAD:emergencias-2-ui-core
