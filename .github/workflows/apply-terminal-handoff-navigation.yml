name: Apply SCCM 2026 NMBA semantics

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[bnm-sccm-2026-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply SCCM 2026 NMBA migration
        run: node scripts/aplica-bnm-sdccm-2026-update.cjs

      - name: Validate sedation module
        run: npm run test:sedacao

      - name: Validate SCCM 2026 NMBA semantics
        run: node scripts/valida-bnm-sccm-2026.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No SCCM 2026 NMBA changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sedation-engine.ts lib/i18n/modules/sedacao.ts
          git commit -m "update NMBA ARDS semantics to SCCM 2026 [bnm-sccm-2026-applied]"
          git push origin HEAD:emergencias-2-ui-core
