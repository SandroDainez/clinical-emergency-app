name: Apply sedation ketamine morphine update

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[sedation-ketamine-morphine-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply exact evidence migration
        run: node scripts/aplica-sedacao-ketamina-morfina-update.cjs

      - name: Validate sedation module
        run: npm run test:sedacao

      - name: Validate EAP module
        run: npm run test:eap

      - name: Validate evidence guard
        run: node scripts/valida-sedacao-evidencia-2025.cjs

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No ketamine/morphine evidence changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sedation-engine.ts eap-decision-tree.ts lib/morfina-dispneia.ts
          git commit -m "update ketamine and morphine evidence [sedation-ketamine-morphine-applied]"
          git push origin HEAD:emergencias-2-ui-core
