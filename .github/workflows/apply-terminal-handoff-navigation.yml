name: Apply etomidate safety semantics

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[etomidate-safety-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply exact etomidate migration
        run: node scripts/aplica-etomidato-seguranca-update.cjs

      - name: Validate sedation module
        run: npm run test:sedacao

      - name: Validate etomidate safety semantics
        run: node scripts/valida-etomidato-seguranca.cjs

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No etomidate safety changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sedation-engine.ts
          git commit -m "correct etomidate dose semantics [etomidate-safety-applied]"
          git push origin HEAD:emergencias-2-ui-core
