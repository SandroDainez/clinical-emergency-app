name: Apply ISR awake airway rescue and post-intubation 2026

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[isr-awake-rescue-postiot-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply ISR awake airway rescue and post-intubation migration
        run: |
          node scripts/aplica-isr-via-acordada-resgate-posiot-2026.cjs
          node scripts/ajusta-isr-via-acordada-i18n-2026.cjs

      - name: Validate ISR module
        run: npm run test:isr

      - name: Validate ISR awake airway rescue and post-intubation 2026
        run: node scripts/valida-isr-via-acordada-resgate-posiot-2026.cjs

      - name: Validate prior ISR gates
        run: |
          node scripts/valida-isr-preoxigenacao-2026.cjs
          node scripts/valida-isr-coerencia-bnm-ventilacao.cjs
          node scripts/valida-isr-hemodinamica-pretratamento-2026.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No ISR awake airway/rescue/post-IOT changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rsi-decision-tree.ts lib/i18n/modules/isr.ts
          git commit -m "make ISR awake airway failure executable and align rescue/post-IOT [isr-awake-rescue-postiot-applied]"
          git push origin HEAD:emergencias-2-ui-core
