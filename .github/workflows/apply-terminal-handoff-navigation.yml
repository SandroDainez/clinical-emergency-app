name: Apply sedation dose-limit semantics

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[sedation-dose-limits-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply exact dose-limit migration
        run: node scripts/aplica-sedacao-limites-dose-update.cjs

      - name: Validate sedation module
        run: npm run test:sedacao

      - name: Validate dose-limit semantics
        run: node scripts/valida-sedacao-limites-dose.cjs

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No sedation dose-limit changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sedation-engine.ts
          git commit -m "correct sedation dose-limit semantics [sedation-dose-limits-applied]"
          git push origin HEAD:emergencias-2-ui-core
