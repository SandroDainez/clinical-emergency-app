name: Apply sedation UI hierarchy

on:
  push:
    branches:
      - emergencias-2-ui-core

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[sedation-ui-hierarchy-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: emergencias-2-ui-core
          fetch-depth: 0

      - name: Apply sedation UI hierarchy migration
        run: node scripts/aplica-sedacao-ui-hierarquia.cjs

      - name: Validate sedation module
        run: npm run test:sedacao

      - name: Validate sedation BNM UI semantics
        run: node scripts/valida-sedacao-bnm-ui-semantics.cjs

      - name: Validate sedation UI hierarchy
        run: node scripts/valida-sedacao-ui-hierarquia.cjs

      - name: Validate translation consistency
        run: npm run test:traducao-composta

      - name: Validate Emergencias 2 structural suite
        run: npm run test:emergencias-2

      - name: Commit validated migration
        run: |
          if git diff --quiet; then
            echo "No sedation UI hierarchy changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/protocol-screen/sedation-calculator-screen.tsx lib/i18n/modules/sedacao.ts
          git commit -m "improve sedation calculator visual hierarchy [sedation-ui-hierarchy-applied]"
          git push origin HEAD:emergencias-2-ui-core
