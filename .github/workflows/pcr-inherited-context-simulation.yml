name: PCR inherited context validation

on:
  push:
    branches:
      - emergencias-2-ui-core
    paths:
      - "components/protocol-screen.tsx"
      - "components/protocol-screen/acls-protocol-screen.tsx"
      - "components/protocol-screen/pcr-inherited-context-card.tsx"
      - "lib/pcr-handoff-context-adapter.ts"
      - "lib/pcr-inherited-context-runtime.ts"
      - "scripts/valida-pcr-inherited-context*.cjs"
      - ".github/workflows/pcr-inherited-context-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inherited-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate terminal PCR handoff remains active
        run: |
          node scripts/valida-pcr-handoffs-terminais-pos-migracao.cjs
          node scripts/valida-contagem-transition-contracts.cjs
          node scripts/valida-cobertura-other-module-registry.cjs

      - name: Validate inherited context integration
        run: |
          node scripts/valida-pcr-inherited-context-card.cjs
          node scripts/valida-pcr-inherited-context-pos-migracao.cjs

      - name: Run executable PCR handoff tests
        run: |
          node scripts/test-clinical-handoffs-emergencias-2.cjs
          node scripts/test-tree-to-handoff-emergencias-2.cjs
