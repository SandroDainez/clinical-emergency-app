name: Apply operational AVC action step

on:
  push:
    branches: [fix-avc-slider-first]
    paths:
      - scripts/ajusta-actionstep-operacional-avc.cjs
      - components/protocol-screen/clinical-action-step-card.tsx
      - .github/workflows/apply-actionstep-operacional-avc.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply operational ActionStep contract and AVC entry
        run: node scripts/ajusta-actionstep-operacional-avc.cjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false
      - name: UI patterns
        run: npm run test:padroes-ui
      - name: Standalone AVC compile used by validator
        run: |
          rm -rf /tmp/avc-standalone
          npx tsc --ignoreConfig --module node16 --target es2020 --esModuleInterop --moduleResolution node16 --outDir /tmp/avc-standalone avc-decision-tree.ts lib/trombolise-guiada-por-imagem.ts
      - name: AVC regression
        run: npm run test:avc
      - name: Emergencias 2 regression
        run: npm run test:emergencias-2
      - name: Validate scope
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' avc-decision-tree.ts components/protocol-screen/acls-decision-flow-screen.tsx components/protocol-screen/clinical-action-step-adapter.tsx core/decision-tree/engine.ts core/decision-tree/types.ts | sort)"
          test "$changed" = "$expected"
      - name: Commit validated operational ActionStep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avc-decision-tree.ts components/protocol-screen/acls-decision-flow-screen.tsx components/protocol-screen/clinical-action-step-adapter.tsx core/decision-tree/engine.ts core/decision-tree/types.ts
          git commit -m "Make AVC initial actions operational and traceable"
          git pull --rebase origin fix-avc-slider-first
          git push origin HEAD:fix-avc-slider-first
