name: One-shot electrolyte pending-state convergence

on:
  push:
    branches:
      - fix-avc-slider-first
    paths:
      - .github/workflows/one-shot-electrolyte-pending-state.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-avc-slider-first
          fetch-depth: 0

      - name: Replace midpoint pending state with canonical neutral origin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/protocol-screen/electrolyte-calculator-screen.tsx")
          src = path.read_text()

          old = '''        <NumericStepper
          valor={
            temValor
              ? numero
              : // Sem valor escolhido o controle parte do MEIO da faixa, não de
                // um número que pareça sugestão clínica — e só grava quando o
                // médico arrasta. Mesma regra da árvore.
                Number(((faixa.min + faixa.max) / 2).toFixed(faixa.casas))
          }
          onChange={(n) => applyPickerValue(field, fmt(n, faixa.casas))}
          // Confirmar é GRAVAR o valor corrente: quem solta a barra no ponto de
          // partida informou aquele valor, e a tela precisa parar de dizer que
          // não sabe.
          onConfirmar={(n) => applyPickerValue(field, fmt(n, faixa.casas))}
          min={faixa.min}
          max={faixa.max}
          passo={faixa.passo}
          casas={faixa.casas}
          testID={`slider-${field}`}
        />
        {/* ⚠️ O NÚMERO GRANDE NÃO É UM VALOR MEDIDO enquanto ninguém arrastou.
            A barra precisa partir de algum ponto, e o meio da faixa é o menos
            sugestivo — mas na tela ele aparece do mesmo tamanho de um valor
            informado. Dizer isso é a mesma regra do peso não confirmado nas
            Vasoativas: o app não finge que mediu o que não mediu. */}
        {!temValor ? (
          <Text style={styles.inputAindaNaoInformado}>
            {tr("⚠️ Ainda NÃO informado — a barra parte do meio da faixa. Arraste ou use −/+ para registrar o valor do paciente.")}
          </Text>
        ) : null}'''

          new = '''        <NumericStepper
          valor={temValor ? numero : faixa.min}
          valorVisivel={temValor}
          onChange={(n) => applyPickerValue(field, fmt(n, faixa.casas))}
          onConfirmar={(n) => applyPickerValue(field, fmt(n, faixa.casas))}
          min={faixa.min}
          max={faixa.max}
          passo={faixa.passo}
          casas={faixa.casas}
          testID={`slider-${field}`}
        />
        {/* Estado canônico: sem interação não existe valor clínico. O mínimo é
            apenas a origem visual da trilha e fica oculto por `valorVisivel`;
            arrastar/soltar confirma o primeiro valor real do paciente. */}
        {!temValor ? (
          <Text style={styles.inputAindaNaoInformado}>
            {tr("Valor ainda não informado — toque na barra para definir.")}
          </Text>
        ) : null}'''

          count = src.count(old)
          if count != 1:
              raise SystemExit(f"bloco esperado encontrado {count} vez(es); abortando sem editar")

          path.write_text(src.replace(old, new))
          PY

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-electrolyte-pending-state.yml
          git add components/protocol-screen/electrolyte-calculator-screen.tsx
          git diff --cached --check
          git commit -m "fix: align electrolyte sliders with neutral pending state"
          git push origin HEAD:fix-avc-slider-first
